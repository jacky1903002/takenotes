<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TakeNote - 個人雲端隨手筆記</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        darkCard: '#1e293b',
                    }
                }
            }
        }
    </script>
    <!-- Marked.js for Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 dark:bg-darkBg text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

    <!-- 登入畫面 (Authentication View) -->
    <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-sm">
        <div class="bg-white dark:bg-darkCard p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-200 dark:border-slate-700">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-500/10 text-indigo-500 mb-4 text-2xl">
                    <i class="fa-solid fa-note-sticky"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight">TakeNote 雲端札記</h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">請登入您的 Firebase 帳號以存取筆記</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">電子郵件</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">密碼</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <div id="auth-error" class="text-red-500 text-xs hidden"></div>
                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl transition shadow-lg shadow-indigo-500/25">
                    登入系統
                </button>
            </form>
        </div>
    </div>

    <!-- 主介面 (Main App View) -->
    <div id="app-screen" class="hidden flex-1 flex flex-col h-screen overflow-hidden">
        <!-- 頂端導覽列 -->
        <header class="h-16 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-darkCard/80 backdrop-blur-md px-6 flex items-center justify-between shrink-0 z-20">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold">
                    <i class="fa-solid fa-feather-pointed"></i>
                </div>
                <span class="font-bold text-lg tracking-tight">TakeNote</span>
            </div>
            <div class="flex items-center space-x-4">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="search-input" placeholder="搜尋標題、內文或標籤..." class="pl-9 pr-4 py-2 bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-64">
                </div>
                <button id="dark-mode-toggle" class="p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400 transition">
                    <i class="fa-solid fa-moon dark:fa-sun"></i>
                </button>
                <div class="h-6 w-px bg-slate-200 dark:bg-slate-700"></div>
                <button id="logout-btn" class="flex items-center space-x-2 text-sm text-slate-600 dark:text-slate-300 hover:text-red-500 transition">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span id="user-email-display" class="hidden sm:inline"></span>
                </button>
            </div>
        </header>

        <!-- 內容工作區 -->
        <div class="flex-1 flex overflow-hidden">
            <!-- 左側筆記列表 -->
            <aside class="w-80 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-darkCard flex flex-col shrink-0">
                <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400">所有筆記</span>
                    <button id="new-note-btn" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium rounded-lg transition flex items-center space-x-1.5 shadow-sm">
                        <i class="fa-solid fa-plus"></i>
                        <span>新增筆記</span>
                    </button>
                </div>
                <div id="notes-list" class="flex-1 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-800/50">
                    <!-- 動態渲染筆記列表 -->
                </div>
            </aside>

            <!-- 右側編輯與預覽區 -->
            <main class="flex-1 flex flex-col bg-slate-50 dark:bg-darkBg overflow-hidden">
                <div id="empty-state" class="flex-1 flex flex-col items-center justify-center text-slate-400">
                    <i class="fa-regular fa-note-sticky text-6xl mb-4 opacity-30"></i>
                    <p class="text-sm">請從左側選擇一篇筆記，或點擊「新增筆記」開始寫作</p>
                </div>

                <div id="editor-container" class="flex-1 flex flex-col hidden h-full">
                    <!-- 編輯器上方工具列 -->
                    <div class="px-6 py-3 bg-white dark:bg-darkCard border-b border-slate-200 dark:border-slate-800 flex items-center justify-between shrink-0">
                        <input type="text" id="note-title-input" placeholder="輸入文章標題..." class="text-lg font-bold bg-transparent border-none focus:outline-none w-full mr-4">
                        <div class="flex items-center space-x-3 shrink-0">
                            <span id="save-status" class="text-xs text-slate-400">已儲存至雲端</span>
                            <button id="delete-note-btn" class="p-2 text-slate-400 hover:text-red-500 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>

                    <!-- 標籤與中繼資訊列 -->
                    <div class="px-6 py-2 bg-white/50 dark:bg-darkCard/50 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 shrink-0">
                        <div class="flex items-center space-x-2 w-full">
                            <i class="fa-solid fa-tags"></i>
                            <input type="text" id="note-tags-input" placeholder="標籤 (用逗號分隔，例如: 生活, 閱讀, 攝影)" class="bg-transparent border-none focus:outline-none w-full">
                        </div>
                        <div id="note-stats" class="shrink-0 space-x-3">
                            <span>字數: 0</span>
                            <span>閱讀時間: 0 分鐘</span>
                        </div>
                    </div>

                    <!-- 雙欄編輯與預覽 -->
                    <div class="flex-1 flex overflow-hidden">
                        <!-- Markdown 輸入框 -->
                        <div class="flex-1 flex flex-col border-r border-slate-200 dark:border-slate-800">
                            <textarea id="note-body-input" placeholder="開始撰寫您的 Markdown 筆記... (支援標題、列表、代碼塊、待辦事項)" class="flex-1 p-6 bg-transparent resize-none border-none focus:outline-none font-mono text-sm leading-relaxed"></textarea>
                        </div>
                        <!-- 即時預覽區 -->
                        <div class="flex-1 flex flex-col bg-white dark:bg-darkCard overflow-y-auto p-6">
                            <div id="markdown-preview" class="prose dark:prose-invert max-w-none text-sm"></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 您的 Firebase 設定
        const firebaseConfig = {
            apiKey: "AIzaSyBBDID8PF-0Ie-OKX9x4pQ3o0i49ozwH-8",
            authDomain: "takenote-b7ec0.firebaseapp.com",
            projectId: "takenote-b7ec0",
            storageBucket: "takenote-b7ec0.firebasestorage.app",
            messagingSenderId: "331345981558",
            appId: "1:331345981558:web:0deaecad1900d8cb6a2f57",
            measurementId: "G-SCVYMSQTRT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // UI DOM Elements
        const authScreen = document.getElementById('auth-screen');
        const appScreen = document.getElementById('app-screen');
        const loginForm = document.getElementById('login-form');
        const loginEmail = document.getElementById('login-email');
        const loginPassword = document.getElementById('login-password');
        const authError = document.getElementById('auth-error');
        const logoutBtn = document.getElementById('logout-btn');
        const userEmailDisplay = document.getElementById('user-email-display');
        
        const notesListEl = document.getElementById('notes-list');
        const newNoteBtn = document.getElementById('new-note-btn');
        const emptyState = document.getElementById('empty-state');
        const editorContainer = document.getElementById('editor-container');
        const titleInput = document.getElementById('note-title-input');
        const tagsInput = document.getElementById('note-tags-input');
        const bodyInput = document.getElementById('note-body-input');
        const previewEl = document.getElementById('markdown-preview');
        const deleteBtn = document.getElementById('delete-note-btn');
        const saveStatus = document.getElementById('save-status');
        const searchInput = document.getElementById('search-input');
        const darkModeToggle = document.getElementById('dark-mode-toggle');
        const noteStats = document.getElementById('note-stats');

        let currentUser = null;
        let notesData = {};
        let activeNoteId = null;
        let saveTimeout = null;

        // Dark Mode 切換
        darkModeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // 監聽 Auth 狀態
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                userEmailDisplay.textContent = user.email;
                authScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                loadNotes();
            } else {
                currentUser = null;
                appScreen.classList.add('hidden');
                authScreen.classList.remove('hidden');
            }
        });

        // 登入處理
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            authError.classList.add('hidden');
            try {
                await signInWithEmailAndPassword(auth, loginEmail.value, loginPassword.value);
            } catch (error) {
                authError.textContent = "登入失敗：請檢查 Email 與密碼是否正確";
                authError.classList.remove('hidden');
            }
        });

        // 登出處理
        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        // 載入 Realtime Database 中的筆記
        async function loadNotes() {
            if (!currentUser) return;
            const notesRef = ref(db, `users/${currentUser.uid}/notes`);
            const snapshot = await get(notesRef);
            if (snapshot.exists()) {
                notesData = snapshot.val();
            } else {
                notesData = {};
            }
            renderNotesList();
        }

        // 渲染左側列表
        function renderNotesList(filterText = '') {
            notesListEl.innerHTML = '';
            const sortedIds = Object.keys(notesData).sort((a, b) => (notesData[b].updatedAt || 0) - (notesData[a].updatedAt || 0));

            if (sortedIds.length === 0) {
                notesListEl.innerHTML = `<div class="p-6 text-center text-xs text-slate-400">尚無筆記紀錄</div>`;
                return;
            }

            sortedIds.forEach(id => {
                const note = notesData[id];
                const title = note.title || '無標題筆記';
                const body = note.body || '';
                const tags = note.tags || '';

                if (filterText && !title.toLowerCase().includes(filterText.toLowerCase()) && !body.toLowerCase().includes(filterText.toLowerCase()) && !tags.toLowerCase().includes(filterText.toLowerCase())) {
                    return;
                }

                const dateStr = note.updatedAt ? new Date(note.updatedAt).toLocaleDateString() : '';

                const item = document.createElement('div');
                item.className = `p-4 cursor-pointer transition hover:bg-slate-50 dark:hover:bg-slate-800/50 ${id === activeNoteId ? 'bg-indigo-50/50 dark:bg-indigo-950/30 border-l-4 border-indigo-600' : ''}`;
                item.innerHTML = `
                    <div class="font-medium text-sm truncate mb-1">${escapeHtml(title)}</div>
                    <div class="text-xs text-slate-400 truncate mb-2">${escapeHtml(body.substring(0, 50))}</div>
                    <div class="flex items-center justify-between text-[10px] text-slate-400">
                        <span>${dateStr}</span>
                        ${tags ? `<span class="bg-indigo-100 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 px-2 py-0.5 rounded-full">${escapeHtml(tags.split(',')[0].trim())}</span>` : ''}
                    </div>
                `;
                item.addEventListener('click', () => selectNote(id));
                notesListEl.appendChild(item);
            });
        }

        // 新增筆記
        newNoteBtn.addEventListener('click', async () => {
            if (!currentUser) return;
            const newNote = {
                title: '未命名筆記',
                body: '# 新筆記\n\n在這裡開始寫作...',
                tags: '生活',
                updatedAt: Date.now()
            };
            const notesRef = ref(db, `users/${currentUser.uid}/notes`);
            const newRef = push(notesRef);
            await set(newRef, newNote);
            activeNoteId = newRef.key;
            await loadNotes();
            selectNote(activeNoteId);
        });

        // 選擇筆記
        function selectNote(id) {
            activeNoteId = id;
            const note = notesData[id];
            if (!note) return;

            emptyState.classList.add('hidden');
            editorContainer.classList.remove('hidden');

            titleInput.value = note.title || '';
            tagsInput.value = note.tags || '';
            bodyInput.value = note.body || '';

            updatePreviewAndStats();
            renderNotesList();
        }

        // 即時輸入與自動儲存
        function handleInputChanges() {
            if (!activeNoteId || !currentUser) return;

            const updatedNote = {
                title: titleInput.value,
                tags: tagsInput.value,
                body: bodyInput.value,
                updatedAt: Date.now()
            };

            notesData[activeNoteId] = updatedNote;
            updatePreviewAndStats();
            renderNotesList(searchInput.value);

            saveStatus.textContent = "儲存中...";
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                const noteRef = ref(db, `users/${currentUser.uid}/notes/${activeNoteId}`);
                await update(noteRef, updatedNote);
                saveStatus.textContent = "已儲存至雲端";
            }, 800);
        }

        titleInput.addEventListener('input', handleInputChanges);
        tagsInput.addEventListener('input', handleInputChanges);
        bodyInput.addEventListener('input', handleInputChanges);

        // 更新預覽與字數計算
        function updatePreviewAndStats() {
            const text = bodyInput.value;
            previewEl.innerHTML = marked.parse(text);

            // 字數與閱讀時間
            const charCount = text.length;
            const readTime = Math.ceil(charCount / 300); // 假設每分鐘閱讀 300 字
            noteStats.innerHTML = `<span>字數: ${charCount}</span><span>預估閱讀時間: ${readTime} 分鐘</span>`;
        }

        // 刪除筆記
        deleteBtn.addEventListener('click', async () => {
            if (!activeNoteId || !currentUser) return;
            if (confirm('確定要刪除這篇筆記嗎？')) {
                const noteRef = ref(db, `users/${currentUser.uid}/notes/${activeNoteId}`);
                await remove(noteRef);
                delete notesData[activeNoteId];
                activeNoteId = null;
                editorContainer.classList.add('hidden');
                emptyState.classList.remove('hidden');
                renderNotesList();
            }
        });

        // 搜尋監聽
        searchInput.addEventListener('input', (e) => {
            renderNotesList(e.target.value);
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(> /g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
